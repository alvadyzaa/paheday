name: PaheDay check
run-name: "PaheDay check #${{ github.run_number }}"

# Cek pahe.ink & dramaday.me sesuai jadwal, kirim notif ke Telegram.
# State (post yang sudah dilihat) disimpan via Actions cache agar awet antar run.

on:
  schedule:
    # tiap 30 menit. Boleh diubah ke */15 atau */10, tapi perhatikan kuota
    # Actions gratis (2000 mnt/bulan): */30 aman, */15 mepet.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # tombol "Run workflow" manual untuk tes

concurrency:
  group: paheday-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: paheday-state-${{ github.run_id }}
          restore-keys: |
            paheday-state-

      - name: Check & notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          PER_PAGE: "15"
          NOTIFY_UPDATES: "true"
          DRAMADAY_EXCLUDE: "OST"
        run: |
          if [ -f state.json ]; then
            python main.py --once
          else
            echo "Cache state tidak ada (run pertama) - baseline tanpa kirim."
            python main.py --init
          fi
